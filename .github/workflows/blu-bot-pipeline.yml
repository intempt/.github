name: blu-bot-pipeline

on:
  workflow_call:
    secrets:
      BLU_BOT_PRIVATE_KEY:
        required: true

jobs:
  pipeline:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.BLU_BOT_APP_ID }}
          private-key: ${{ secrets.BLU_BOT_PRIVATE_KEY }}

      - name: Drive the admin promotion end to end
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTOR: ${{ github.event.sender.login }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          refuse() {
            echo "::error::$1"
            gh pr comment "$PR" -R "$REPO" --body "blu-bot refused: $1" || true
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/admin-release" >/dev/null 2>&1 || true
            exit 1
          }

          # Green = every check-run and commit status on the PR head is complete and
          # passed, EXCLUDING this very run (its own check is in_progress until we
          # finish) and the ff-merge promotion workflow.
          # Green = every check-run, commit status AND Actions workflow run on the PR head is
          # complete and passed, EXCLUDING this run and the bot/promotion workflows. We also wait for
          # CI to actually APPEAR: a just-pushed build sits queued/in_progress as a workflow run for
          # up to a minute before it registers as a check-run, so check-runs alone read as "nothing
          # pending" = green and blu-bot merged before CI even started. The workflow-run poll plus the
          # "seen" gate close that race; the grace below still lets a repo with genuinely no CI pass.
          wait_ci_green() {
            local pr="$1" sha tries=0 runs bad pending sjson sbad spending
            local wruns wactive wfailed wtotal seen=0
            local xchk="ff-merge|create.?pr|autopr|blu-bot"
            local xflow="ff-merge|create.?pr|auto.?pr|blu-bot|merge staging"
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            while [ "$tries" -lt 270 ]; do
              runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')
              bad=$(echo "$runs" | jq --arg rid "$RUN_ID" --arg x "$xchk" '[.check_runs[] | select(((.details_url // "")|test("/runs/"+$rid+"/"))|not) | select((.name|ascii_downcase|test($x))|not) | select(.status=="completed" and (((.conclusion//"")|ascii_downcase) as $c | ($c=="success" or $c=="neutral" or $c=="skipped")|not))] | length')
              pending=$(echo "$runs" | jq --arg rid "$RUN_ID" --arg x "$xchk" '[.check_runs[] | select(((.details_url // "")|test("/runs/"+$rid+"/"))|not) | select((.name|ascii_downcase|test($x))|not) | select(.status!="completed")] | length')
              sjson=$(gh api "repos/$REPO/commits/$sha/status" 2>/dev/null || echo '{"statuses":[]}')
              sbad=$(echo "$sjson" | jq '[.statuses[] | select((.context|ascii_downcase|test("blu-bot|ff-merge|create.?pr|autopr"))|not) | select(.state=="failure" or .state=="error")] | length')
              spending=$(echo "$sjson" | jq '[.statuses[] | select((.context|ascii_downcase|test("blu-bot|ff-merge|create.?pr|autopr"))|not) | select(.state=="pending")] | length')
              wruns=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" 2>/dev/null || echo '{"workflow_runs":[]}')
              wactive=$(echo "$wruns" | jq --arg rid "$RUN_ID" --arg x "$xflow" '[.workflow_runs[] | select((.id|tostring) != $rid) | select(((.name//"")|ascii_downcase|test($x))|not) | select(.status!="completed")] | length')
              wfailed=$(echo "$wruns" | jq --arg rid "$RUN_ID" --arg x "$xflow" '[.workflow_runs[] | select((.id|tostring) != $rid) | select(((.name//"")|ascii_downcase|test($x))|not) | select(.status=="completed" and (((.conclusion//"")|ascii_downcase) as $c | ($c=="success" or $c=="neutral" or $c=="skipped")|not))] | length')
              wtotal=$(echo "$wruns" | jq --arg rid "$RUN_ID" --arg x "$xflow" '[.workflow_runs[] | select((.id|tostring) != $rid) | select(((.name//"")|ascii_downcase|test($x))|not)] | length')
              # Hard red on any failure.
              if [ "$bad" -gt 0 ] || [ "$sbad" -gt 0 ] || [ "$wfailed" -gt 0 ]; then return 1; fi
              # CI has appeared at all (this iteration or earlier)?
              if [ "$pending" -gt 0 ] || [ "$spending" -gt 0 ] || [ "$wactive" -gt 0 ] || [ "$wtotal" -gt 0 ]; then seen=1; fi
              # Green only when nothing is pending/active AND CI actually ran.
              if [ "$pending" -eq 0 ] && [ "$spending" -eq 0 ] && [ "$wactive" -eq 0 ] && [ "$seen" -eq 1 ]; then return 0; fi
              # Grace: no CI has appeared after ~3 min -> repo has none, proceed.
              if [ "$seen" -eq 0 ] && [ "$tries" -ge 9 ]; then return 0; fi
              sleep 20; tries=$((tries+1))
            done
            return 2
          }

          approve() {
            local pr="$1" body="$2" sha
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            gh api -X POST "repos/$REPO/pulls/$pr/reviews" -f event=APPROVE -f commit_id="$sha" -f body="$body"
          }

          # Only an admin may run blu-bot (robot is waived on this path).
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          [ "$perm" = admin ] || refuse "@$ACTOR must be a repo/org admin to run blu-bot (got: $perm)"

          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          [ "$state" = open ] || refuse "PR #$PR is not open"

          PROV="Admin-path approval by blu-bot. Robot review waived by admin @$ACTOR."

          if [ "$BASE" = main ] || [ "$BASE" = master ]; then
            # Admin labelled a staging -> main promotion PR directly: approve + hand to FF_BOT.
            # No CI wait: everything on staging already passed CI on its way in, ff-merge-bot
            # waits for no check either, and the promotion PR's head IS the staging commit, so
            # waiting would only re-check staging's own push workflows (preview builds, cache
            # warming), any of which could block a release without saying anything about it.
            [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref)" = staging ] || refuse "only staging can be promoted to $BASE"
            approve "$PR" "$PROV Promoting staging -> $BASE."
            gh pr edit "$PR" -R "$REPO" --add-label ff-merge
            echo "blu-bot approved promotion PR #$PR and labelled ff-merge; FF_BOT will fast-forward $BASE."
            exit 0
          fi

          [ "$BASE" = staging ] || refuse "blu-bot runs on a feature->staging PR or a staging->main PR (base was $BASE)"

          # Feature -> staging: bring the branch up to date, wait for CI, approve, merge. Stops at
          # staging: promoting staging to production stays a manual step (label the staging -> main
          # PR `ff-merge`, or `admin-release` for the branch above).
          #
          # Branch protection may require the PR to be up to date with staging. The update is pushed
          # with the blu-bot App token, so CI starts on it (a GITHUB_TOKEN push would start no
          # workflow). If staging moves again while CI runs, the merge is refused as out of date:
          # update and go round again, a few times at most.
          head_sha() { gh api "repos/$REPO/pulls/$1" --jq .head.sha; }
          behind_by() { gh api "repos/$REPO/compare/$BASE...$(head_sha "$1")" --jq .behind_by; }

          update_if_behind() {
            local pr="$1" before
            [ "$(behind_by "$pr")" -gt 0 ] || return 0
            before=$(head_sha "$pr")
            gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$before" >/dev/null               || refuse "could not bring PR #$pr up to date with $BASE (merge conflict?); merge $BASE into it and re-label"
            # update-branch is asynchronous: wait for the new head before polling its CI.
            for _ in $(seq 1 30); do
              [ "$(head_sha "$pr")" != "$before" ] && return 0
              sleep 5
            done
            refuse "updated PR #$pr with $BASE, but its new head did not appear"
          }

          merged=0
          for attempt in 1 2 3; do
            update_if_behind "$PR"
            wait_ci_green "$PR" || refuse "CI is not green on PR #$PR"
            approve "$PR" "$PROV Merging to staging."
            if gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$(head_sha "$PR")" >/dev/null; then
              merged=1
              break
            fi
            echo "merge attempt $attempt refused (likely $BASE moved while CI ran); updating and retrying"
          done
          [ "$merged" -eq 1 ] || refuse "could not merge PR #$PR to $BASE after 3 attempts (not mergeable)"

          gh api -X DELETE "repos/$REPO/issues/$PR/labels/admin-release" >/dev/null 2>&1 || true
          echo "blu-bot merged PR #$PR to $BASE. Promotion to production is manual: label the staging -> main PR."
