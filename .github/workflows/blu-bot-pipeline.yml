name: blu-bot-pipeline

on:
  workflow_call:
    secrets:
      BLU_BOT_PRIVATE_KEY:
        required: true

jobs:
  pipeline:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.BLU_BOT_APP_ID }}
          private-key: ${{ secrets.BLU_BOT_PRIVATE_KEY }}

      - name: Drive the admin promotion end to end
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTOR: ${{ github.event.sender.login }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          refuse() {
            echo "::error::$1"
            gh pr comment "$PR" -R "$REPO" --body "blu-bot refused: $1" || true
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/admin-release" >/dev/null 2>&1 || true
            exit 1
          }

          # Green = every check-run and commit status on the PR head is complete and
          # passed, EXCLUDING this very run (its own check is in_progress until we
          # finish) and the ff-merge promotion workflow.
          wait_ci_green() {
            local pr="$1" sha tries=0 runs bad pending sjson sbad spending
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            while [ "$tries" -lt 80 ]; do
              runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')
              bad=$(echo "$runs" | jq --arg rid "$RUN_ID" '[.check_runs[] | select(((.details_url // "")|test("/runs/"+$rid+"/"))|not) | select((.name|ascii_downcase|test("ff-merge|create.?pr|autopr|blu-bot"))|not) | select(.status=="completed" and (((.conclusion//"")|ascii_downcase) as $c | ($c=="success" or $c=="neutral" or $c=="skipped")|not))] | length')
              pending=$(echo "$runs" | jq --arg rid "$RUN_ID" '[.check_runs[] | select(((.details_url // "")|test("/runs/"+$rid+"/"))|not) | select((.name|ascii_downcase|test("ff-merge|create.?pr|autopr|blu-bot"))|not) | select(.status!="completed")] | length')
              sjson=$(gh api "repos/$REPO/commits/$sha/status" 2>/dev/null || echo '{"statuses":[]}')
              sbad=$(echo "$sjson" | jq '[.statuses[] | select((.context|ascii_downcase|test("blu-bot|ff-merge|create.?pr|autopr"))|not) | select(.state=="failure" or .state=="error")] | length')
              spending=$(echo "$sjson" | jq '[.statuses[] | select((.context|ascii_downcase|test("blu-bot|ff-merge|create.?pr|autopr"))|not) | select(.state=="pending")] | length')
              if [ "$bad" -gt 0 ] || [ "$sbad" -gt 0 ]; then return 1; fi
              if [ "$pending" -eq 0 ] && [ "$spending" -eq 0 ]; then return 0; fi
              sleep 10; tries=$((tries+1))
            done
            return 2
          }

          approve() {
            local pr="$1" body="$2" sha
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            gh api -X POST "repos/$REPO/pulls/$pr/reviews" -f event=APPROVE -f commit_id="$sha" -f body="$body"
          }

          # Only an admin may run blu-bot (robot is waived on this path).
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          [ "$perm" = admin ] || refuse "@$ACTOR must be a repo/org admin to run blu-bot (got: $perm)"

          state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          [ "$state" = open ] || refuse "PR #$PR is not open"

          PROV="Admin-path approval by blu-bot. Robot review waived by admin @$ACTOR."

          if [ "$BASE" = main ] || [ "$BASE" = master ]; then
            # Admin labelled a staging -> main promotion PR directly: approve + hand to FF_BOT.
            [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref)" = staging ] || refuse "only staging can be promoted to $BASE"
            wait_ci_green "$PR" || refuse "CI is not green on promotion PR #$PR"
            approve "$PR" "$PROV Promoting staging -> $BASE."
            gh pr edit "$PR" -R "$REPO" --add-label ff-merge
            echo "blu-bot approved promotion PR #$PR and labelled ff-merge; FF_BOT will fast-forward $BASE."
            exit 0
          fi

          [ "$BASE" = staging ] || refuse "blu-bot runs on a feature->staging PR or a staging->main PR (base was $BASE)"

          # Feature -> staging: wait for CI, approve, merge.
          wait_ci_green "$PR" || refuse "CI is not green on PR #$PR"
          approve "$PR" "$PROV Merging to staging."
          merge_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$merge_sha" \
            || refuse "could not merge PR #$PR to staging (not mergeable)"

          # Wait for auto-pr's staging -> production PR. It must be authored by github-actions,
          # NOT blu-bot: GitHub forbids approving your own PR, so a blu-bot-authored promotion PR
          # could never get blu-bot's approval. auto-pr's own flaky check is ignored by wait_ci_green.
          prodbase=main
          gh api "repos/$REPO/branches/main" >/dev/null 2>&1 || prodbase=master
          find_promo() {
            gh pr list -R "$REPO" --base "$prodbase" --head staging --state open --json number,author \
              --jq '[.[] | select(.author.login != "intempt-blu-bot")][0].number' 2>/dev/null || true
          }
          # Give auto-pr a short head start, then open the promotion PR ourselves using the default
          # Actions token so it is authored by github-actions (blu-bot cannot approve its own PR).
          promo=""
          for _ in $(seq 1 6); do
            promo=$(find_promo); [ -n "$promo" ] && break; sleep 5
          done
          if [ -z "$promo" ]; then
            GH_TOKEN="$DEFAULT_TOKEN" gh pr create -R "$REPO" --base "$prodbase" --head staging \
              --title "Merge Staging into Main" --body "Promotion opened for blu-bot (admin path)." >/dev/null 2>&1 || true
            for _ in $(seq 1 12); do
              promo=$(find_promo); [ -n "$promo" ] && break; sleep 5
            done
          fi
          [ -n "$promo" ] || refuse "merged to staging, but could not obtain a github-actions staging -> $prodbase PR"

          wait_ci_green "$promo" || refuse "merged to staging, but CI is not green on promotion PR #$promo"
          approve "$promo" "$PROV Promoting staging -> main."
          gh pr edit "$promo" -R "$REPO" --add-label ff-merge

          gh api -X DELETE "repos/$REPO/issues/$PR/labels/admin-release" >/dev/null 2>&1 || true
          echo "blu-bot merged PR #$PR to staging and triggered FF of main via promotion PR #$promo."
