name: ban-hosted-runners
on:
  pull_request:
jobs:
  ban-hosted-runners:
    # The ban is for private repos; public .github is exempt and cannot use the in-cluster runners.
    if: github.event.repository.private
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@v4
      - name: Reject GitHub-hosted ubuntu runners
        run: |
          set -euo pipefail
          [ -d .github/workflows ] || { echo "No workflows directory."; exit 0; }
          viol=""
          while IFS= read -r wf; do
            if sed 's/#.*//' "$wf" | grep -qE 'ubuntu-(latest|20\.04|22\.04|24\.04)'; then
              viol="$viol $wf"
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          if [ -n "$viol" ]; then
            echo "::error::GitHub-hosted ubuntu runners are banned. Use runs-on: intempt-ubuntu-github-runner. macOS and Windows runners remain allowed. Offending files:$viol"
            for wf in $viol; do echo "--- $wf ---"; sed 's/#.*//' "$wf" | grep -nE 'ubuntu-(latest|20\.04|22\.04|24\.04)' || true; done
            exit 1
          fi
          echo "OK: no GitHub-hosted ubuntu runners (comments ignored)."
