name: ban-hosted-runners
on:
  pull_request:
jobs:
  ban-hosted-runners:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@v4
      - name: Reject GitHub-hosted ubuntu runners
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows ]; then echo "No workflows directory."; exit 0; fi
          found=$(grep -rEn 'ubuntu-(latest|20\.04|22\.04|24\.04)' .github/workflows/ || true)
          if [ -n "$found" ]; then
            echo "::error::GitHub-hosted ubuntu runners are banned. Use runs-on: intempt-ubuntu-github-runner. macOS and Windows runners remain allowed."
            printf '%s\n' "$found"
            exit 1
          fi
          echo "OK: no GitHub-hosted ubuntu runners."
